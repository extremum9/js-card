<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Formatter</title>
    <link rel="stylesheet" href="main.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main>
      <form class="form js-form" method="post" novalidate>
        <div class="form-field">
          <label class="form-label" for="cardNumber">Card number</label>
          <input id="cardNumber" class="form-control js-form-control js-card-number-control" name="number" type="text" inputmode="numeric" autocomplete="cc-number" spellcheck="false" placeholder="1234 1234 1234 1234" aria-required="true" aria-invalid="false" aria-describedby="cardNumberError" />
          <p id="cardNumberError" class="form-error-message" aria-live="polite"></p>
        </div>
        <div class="form-field">
          <label class="form-label" for="cardName">Name on card</label>
          <input id="cardName" class="form-control js-form-control" name="name" type="text" autocomplete="cc-name" spellcheck="false" placeholder="John Doe" aria-required="true" aria-invalid="false" aria-describedby="cardNameError" />
          <p id="cardNameError" class="form-error-message" aria-live="polite"></p>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label class="form-label" for="cardExpirationDate">Expiration date</label>
            <input id="cardExpirationDate" class="form-control js-form-control js-card-expiration-date-control" name="expirationDate" type="text" inputmode="numeric" autocomplete="cc-exp" spellcheck="false" placeholder="MM / YY" aria-required="true" aria-invalid="false" aria-describedby="cardExpirationDateError" />
            <p id="cardExpirationDateError" class="form-error-message" aria-live="polite"></p>
          </div>
          <div class="form-field">
            <label class="form-label" for="cardSecurityCode">Security code</label>
            <input id="cardSecurityCode" class="form-control js-form-control js-card-security-code-control" name="securityCode" type="text" inputmode="numeric" autocomplete="cc-csc" spellcheck="false" placeholder="CVC" aria-required="true" aria-invalid="false" aria-describedby="cardSecurityCodeError" />
            <p id="cardSecurityCodeError" class="form-error-message" aria-live="polite"></p>
          </div>
        </div>
        <button class="submit-button" type="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
