<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Formatter</title>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main>
      <form class="form">
        <div class="form-field">
          <label class="form-label" for="cardNumber">Card number</label>
          <input id="cardNumber" class="form-control" name="cardNumber" type="text" inputmode="numeric" autocomplete="cc-number" spellcheck="false" placeholder="1234 1234 1234 1234" aria-invalid="true" aria-describedby="cardNumberError" />
          <p id="cardNumberError" class="form-error-message" role="alert" aria-live="polite">Your card number is incomplete.</p>
        </div>
        <div class="form-field">
          <label class="form-label" for="cardName">Name on card</label>
          <input id="cardName" class="form-control" name="cardName" type="text" autocomplete="cc-name" spellcheck="false" placeholder="John Doe" aria-invalid="true" aria-describedby="cardNameError" />
          <p id="cardNameError" class="form-error-message" role="alert" aria-live="polite">Name is too short.</p>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label class="form-label" for="cardExpirationDate">Expiration date</label>
            <input id="cardExpirationDate" class="form-control" name="cardExpirationDate" type="text" inputmode="numeric" autocomplete="cc-exp" spellcheck="false" placeholder="MM / YY" aria-invalid="true" aria-describedby="cardExpirationDateError" />
            <p id="cardExpirationDateError" class="form-error-message" role="alert" aria-live="polite">Your card has expired.</p>
          </div>
          <div class="form-field">
            <label class="form-label" for="cardSecurityCode">Security code</label>
            <input id="cardSecurityCode" class="form-control" name="cardSecurityCode" type="text" inputmode="numeric" autocomplete="cc-csc" spellcheck="false" placeholder="CVC" aria-invalid="true" aria-describedby="cardSecurityCodeError" />
            <p id="cardSecurityCodeError" class="form-error-message" role="alert" aria-live="polite">Your security code is incomplete.</p>
          </div>
        </div>
        <button class="submit-button" type="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
